name: ios

on:
  push:
    paths:
      - 'ios/**'
      - 'mobile/**'
      - 'internal/**'
      - 'pkg/**'
      - 'go.mod'
      - 'Makefile'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build iOS app
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gomobile and XcodeGen
        run: |
          version=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          go install golang.org/x/mobile/cmd/gomobile@$version golang.org/x/mobile/cmd/gobind@$version
          gomobile init
          brew install xcodegen

      - name: Build engine
        run: make build/ios

      - name: Build app
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project Autobrr.xcodeproj -scheme Autobrr -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
