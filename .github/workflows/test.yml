name: test

on:
  push:
    branches:
      - "master"
      - "develop"
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/images/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/images/**'
      - '**.md'

permissions:
  contents: read

jobs:
  go:
    name: Test go
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check indexer deprecation tombstones
        if: github.event_name == 'pull_request'
        run: scripts/check-indexer-deprecations.sh "${{ github.event.pull_request.base.sha }}"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -tags=integration,irc_integration_test ./...

      - name: Build engine for iOS
        run: GOOS=ios GOARCH=arm64 go build ./mobile
