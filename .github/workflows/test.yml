name: test

on:
  push:
    branches:
      - "master"
      - "develop"
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/images/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/images/**'
      - '**.md'

env:
  NODE_VERSION: '24.15.0'

permissions:
  contents: read

jobs:
  web:
    name: Test web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: web/package.json

      # It can not be done before installing pnpm
      - name: Set up cache
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Fetch web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run web tests
        working-directory: web
        run: pnpm run test

      - name: Build web frontend
        working-directory: web
        run: CI= pnpm run build

  go:
    name: Test go
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check indexer deprecation tombstones
        if: github.event_name == 'pull_request'
        run: scripts/check-indexer-deprecations.sh "${{ github.event.pull_request.base.sha }}"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -tags=integration,irc_integration_test ./...

      - name: Build engine for iOS
        run: GOOS=ios GOARCH=arm64 go build ./mobile
