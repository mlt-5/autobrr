# config.toml

# Hostname / IP
#
# Default: "127.0.0.1"
#
host = "127.0.0.1"

# Port
#
# Default: 7474
#
port = 7474

# autobrr logs file
# If not defined, logs to stdout
#
# Optional
#
#logPath = "/path/to/logs/autobrr.log"

# Log level
#
# Default: "DEBUG"
#
# Options: "ERROR", "WARN", "INFO", "DEBUG", "TRACE"
#
logLevel = "TRACE"

# Log Max Size
#
# Default: 10
#
# Max log size in megabytes
#
#logMaxSize = 10

# Log Max Backups
#
# Default: 5
#
# Max amount of old log files
#
#logMaxBackups = 5

# Database file
#
# Optional. Defaults to autobrr.db in the config directory.
#
#databaseDSN = "file:/config/data/autobrr.db"

# Custom definitions
#
#customDefinitions = "test/definitions"
